const ARTICLES=[{"category":"Tips & Guide","date":"28 November 2026","title":"Cara Top Up Game yang Aman di SKIEESTORE","summary":"Kenali langkah pemesanan, cara mengisi data tujuan, dan hal penting sebelum menyelesaikan pembayaran.","img":"https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=900&q=80","body":"Sebelum memesan, pastikan kamu memilih game dan nominal produk yang benar. Masukkan User ID serta Zone/Server sesuai instruksi pada halaman produk. Periksa kembali seluruh data sebelum melanjutkan pembayaran.\\n\\nGunakan kanal pembayaran yang tersedia di halaman checkout dan simpan nomor invoice untuk memantau status pesanan. Jangan pernah membagikan kata sandi atau kode OTP kepada siapa pun."},{"category":"Tips & Guide","date":"28 November 2026","title":"Memahami Win Rate Mobile Legends","summary":"Pelajari cara membaca win rate dan menghitung jumlah kemenangan beruntun untuk mencapai target WR.","img":"https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=900&q=80","body":"Win rate adalah persentase kemenangan dibandingkan total pertandingan. Nilainya dapat berubah setelah setiap pertandingan. Kalkulator Win Rate SKIEESTORE membantu memperkirakan jumlah kemenangan tanpa kalah yang dibutuhkan berdasarkan total pertandingan dan WR saat ini.\\n\\nHasil merupakan estimasi karena angka WR yang ditampilkan di game dapat dibulatkan."},{"category":"Update Game","date":"28 November 2026","title":"Kenali Fitur Magic Wheel dan Magic Core","summary":"Ringkasan cara memperkirakan kebutuhan spin dan diamond berdasarkan poin Magic Core yang kamu miliki.","img":"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80","body":"Magic Wheel menggunakan poin Magic Core untuk progres menuju hadiah utama. Catat jumlah poin saat ini sebelum memperkirakan kebutuhan spin. Kalkulator kami menggunakan asumsi satu spin menambah satu poin, dengan harga 1x dan 5x sesuai nilai yang dimasukkan. Periksa aturan event di dalam game sebelum melakukan pembelian."},{"category":"Promo","date":"28 November 2026","title":"Tips Mengatur Budget Diamond Sebelum Gacha","summary":"Buat batas pengeluaran dan hitung estimasi kebutuhan diamond agar rencana top up lebih terukur.","img":"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?auto=format&fit=crop&w=900&q=80","body":"Tentukan batas diamond dan anggaran sebelum mulai melakukan summon. Gunakan kalkulator sebagai perkiraan biaya, bukan jaminan hasil atau hadiah. Sisihkan dana hanya untuk hiburan dan hindari mengejar hasil dengan pengeluaran di luar rencana."}];const grid=document.getElementById("articleGrid"),filters=document.getElementById("articleFilters"),dialog=document.getElementById("articleDialog");
